<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b0f1e">
  <meta name="color-scheme" content="dark">
  <title>天文知识竞赛</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="quiz" id="quiz">
    <section class="daily" id="daily" aria-label="每日目标" hidden>
      <div class="daily-head">
        <span class="daily-label">今日目标</span>
        <span class="daily-count" id="dailyCount">0 / 20</span>
      </div>
      <div class="daily-track" id="dailyTrack" role="progressbar" aria-valuemin="0" aria-valuemax="20" aria-valuenow="0" aria-valuetext="今日答对 0 / 20">
        <div class="daily-fill" id="dailyFill"></div>
      </div>
    </section>
    <p class="free-mode" id="freeMode" hidden>今日目标已完成 · 自由刷题</p>

    <h1 class="question" id="question"></h1>
    <p class="question-type" id="questionType"></p>
    <div class="options" id="options"></div>
    <div class="explain" id="explain" hidden>
      <p class="explain-text" id="explainText"></p>
      <p class="explain-hint" id="explainHint" hidden>轻触继续</p>
    </div>
  </main>

  <div class="celebrate" id="celebrate" aria-hidden="true" hidden>
    <div class="celebrate-glow"></div>
    <div class="celebrate-card">
      <div class="celebrate-emoji">🎉</div>
      <div class="celebrate-title">今日目标达成！</div>
      <div class="celebrate-sub" id="celebrateSub">20 / 20 · 已进入自由刷题</div>
    </div>
    <div class="confetti" id="confetti"></div>
  </div>

  <script src="questions.js"></script>
  <script src="daily.js"></script>
  <script src="app.js"></script>
</body>
</html>
