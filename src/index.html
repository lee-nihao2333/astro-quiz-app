<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b0f1e">
  <meta name="color-scheme" content="dark">
  <title>天文知识竞赛</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="quiz" id="quiz">
    <h1 class="question" id="question"></h1>
    <p class="question-type" id="questionType"></p>
    <div class="options" id="options"></div>
    <div class="explain" id="explain" hidden>
      <p class="explain-text" id="explainText"></p>
      <p class="explain-hint" id="explainHint" hidden>轻触继续</p>
    </div>
  </main>

  <script src="questions.js"></script>
  <script src="app.js"></script>
</body>
</html>
